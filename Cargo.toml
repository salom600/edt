# =============================================================================
# EDT — Modern cross-platform video editor (Rust)
# Cargo workspace root
# =============================================================================
[workspace]
resolver = "2"
members = [
    "crates/edt-core",
    "crates/edt-media",
    "crates/edt-storage",
    "crates/edt-render",
    "crates/edt-export",
    "crates/edt-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salom600/edt"
homepage = "https://github.com/salom600/edt"
documentation = "https://github.com/salom600/edt/blob/main/docs/architecture.md"
authors = ["salom600 <salom600@users.noreply.github.com>"]
description = "Modern cross-platform video editor built in Rust"
keywords = ["video", "editor", "ffmpeg", "egui", "cross-platform"]
categories = ["multimedia::video", "graphics", "gui"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Paths / dirs
directories = "5"

# Image handling
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

# Misc
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Internal crates
edt-core      = { path = "crates/edt-core" }
edt-media     = { path = "crates/edt-media" }
edt-storage   = { path = "crates/edt-storage" }
edt-render    = { path = "crates/edt-render" }
edt-export    = { path = "crates/edt-export" }

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
